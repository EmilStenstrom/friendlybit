app = "friendlybit"
primary_region = "arn"

[build]
  builder = "paketobuildpacks/builder:base"

  [build.args]
    BP_CPYTHON_VERSION = "3.14.6"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
